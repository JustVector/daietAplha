# Konfiguracja Alembic. Adres bazy pochodzi z DATABASE_URL (ustawienia backendu), nie z tego pliku.
# Uruchamiaj z katalogu backend/: uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Nazwy plików migracji: 20261122_1530_<rev>_<opis>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
