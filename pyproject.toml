[project]
name = "daiet"
version = "0.0.0"
description = "Planer posiłków oparty na bazie żywności i silniku więzów"
readme = "README.md"
license = "AGPL-3.0-only"
# Gałąź 3.13 przypięta też w .python-version, obrazie Dockera (backend/Dockerfile) i CI
requires-python = ">=3.13,<3.14"
# Pakiety workspace, żeby testy i mypy widziały kod backendu
dependencies = ["daiet-backend"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
# Katalog główny nie jest pakietem – to workspace: backend/ (S-007) i data-pipeline/ (S-102).
# data-pipeline nie jest pakietem, więc jego zależności instaluje `uv sync --all-packages`
package = false

[tool.uv.workspace]
members = ["backend", "data-pipeline"]

[tool.uv.sources]
daiet-backend = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/W – pycodestyle, F – pyflakes, I – isort, N – nazewnictwo PEP 8,
# UP – nowoczesna składnia, B – bugbear, SIM – uproszczenia
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["daiet_backend", "fetch_usda", "build_sr_wide", "nutrients", "nutrient_coverage",
                     "product_list", "map_products", "build_portions", "categories",
                     "cooking", "product_tags"]

[tool.mypy]
python_version = "3.13"
strict = true
# data-pipeline ma myślnik w nazwie – moduły importujemy z tego katalogu bezpośrednio
mypy_path = ["data-pipeline", "backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["data-pipeline"]
