# Miary domowe (S-109): opisy porcji USDA SR Legacy (`food_portion.modifier`) → polskie miary.
# Używa ich build_portions.py. W SR Legacy `measure_unit_id` jest zawsze 9999 („undetermined”),
# więc miara jest tylko w wolnym tekście, np. „cup, chopped”, „large (3" dia)”, „slice (1 oz)”.
#
# Rozbiór opisu: małe litery; nawiasy z liczbami (wymiary w calach, masa w oz) są pomijane,
# nawiasy bez liczb – czytane jak zwykły tekst; opis z „yield(s)” poza nawiasem (wydajność z opakowania
# lub produktu przed obróbką) jest pomijany. Pierwsza fraza to miara (`volume`, `count`, `sizes`
# albo `ignored`), reszta to rozmiar (`sizes`), postać (`forms`) lub słowa bez znaczenia (`noise`).
# Opis z nieznaną miarą lub nieznanym słowem jest pomijany i trafia do raportu
# docs/data/portions_coverage.md – wtedy uzupełnij ten słownik.
# Klucze: wyrazy a–z małymi literami rozdzielone spacją („pan-fried” = „pan fried”).

# Polska szklanka w ml; gramy szklanki liczone z gęstości produktu (g/ml)
glass_ml: 250

# Miary objętości USDA: ml jednostki (miary US) i polska miara wpisywana wprost z USDA (`measured`).
# Wszystkie służą do wyliczenia gęstości; szklanka i ml są zawsze wyliczane (`calculated`).
volume:
  cup: {ml: 236.5882}
  tbsp: {ml: 14.7868, measure: łyżka}
  tablespoon: {ml: 14.7868, measure: łyżka}
  tsp: {ml: 4.9289, measure: łyżeczka}
  fl oz: {ml: 29.5735}
  pint: {ml: 473.1765}
  quart: {ml: 946.3529}

