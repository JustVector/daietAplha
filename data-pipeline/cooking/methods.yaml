# Przeliczenie wariantów obróbki termicznej (S-106) – parametry i dobór współczynników retencji.
# Opis logiki: docs/data/cooking_calc.md.

# Tłuszcz wchłaniany przy smażeniu: wariant produktu z listy (S-101), którego wartości dolicza się
# w ilości wchłoniętego tłuszczu (olej rzepakowy, „gotowy”).
frying_fat_variant_id: 615

# Minimalna liczba par USDA (surowy i obrobiony, oba zmapowane), od której mediana par wyznacza
# wydajność i wchłonięty tłuszcz grupy.
min_pairs: 3

# Ryby: próg tłuszczu w produkcie wyjściowym (g/100 g) – powyżej niego współczynniki R6 dla ryb tłustych
# (`fatty`), do niego włącznie dla chudych (`codes`).
fatty_fish_fat_g: 5.0

# Składnik bazy v1 (usda_nutrient_id z nutrients.yaml) → numer składnika w tabeli R6 (stary nutrient_nbr).
# Składniki spoza listy nie mają współczynnika w R6 – retencja 100%.
# Witamina A (RAE) i foliany (DFE) dostają współczynnik pokrewnego składnika R6 (RE, foliany ogółem).
r6_nutrients:
  1087: 301  # wapń
  1089: 303  # żelazo
  1090: 304  # magnez
  1091: 305  # fosfor
  1092: 306  # potas
  1093: 307  # sód
  1095: 309  # cynk
  1098: 312  # miedź
  1106: 392  # witamina A (RAE) ← Vitamin A, RE
  1162: 401  # witamina C
  1165: 404  # tiamina
  1166: 405  # ryboflawina
  1167: 406  # niacyna
  1175: 415  # witamina B6
  1178: 418  # witamina B12
  1190: 417  # foliany (DFE) ← Folate, total
  1018: 221  # alkohol etylowy

# Wariant obróbki → kod procesu R6 (kolumna `code`, np. 3451 = VEG,ROOTS,ETC,BAKED; bez zer
# wiodących, bo YAML czyta je jako liczbę ósemkową).
# Reguła dotyczy kategorii (`category`), podkategorii (`subcategory`) albo produktu podstawowego
# (`food_id`) – kody z categories.yaml; wygrywa najbardziej szczegółowa reguła z danym wariantem.
retention:
  # --- warzywa ---
  - category: vegetables
    codes: {gotowany: 3775, gotowany na parze: 3784, pieczony: 3771, smażony: 3780, duszony: 3776,
            grillowany: 3771}
