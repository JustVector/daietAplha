# Składniki odżywcze bazy v1 (S-103). Wybór: decyzja Piotra z 2026-11-22 w backlog/S-103.md.
#
# Pola:
#   usda_nutrient_id – id składnika w USDA FoodData Central (nutrient.csv, kolumna `id`)
#   usda_column      – kolumna w tabeli szerokiej data/interim/sr_wide.parquet (S-102)
#   name_pl          – nazwa dla użytkownika (bot, CLI, słownik bazy)
#   unit             – jednostka wartości na 100 g części jadalnej: g, mg, ug (µg) albo kcal;
#                      musi się zgadzać z jednostką USDA (bez przeliczeń)
#   order            – kolejność prezentacji: 1..N, w kolejności wpisów w tym pliku
#
# Wczytanie i walidacja: data-pipeline/nutrients.py. Raport pokrycia: make nutrient-coverage.

nutrients:
